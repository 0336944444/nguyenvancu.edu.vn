<script>
  document.getElementById("dataForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.querySelector("input[name='name']").value;
    const studentClass = document.querySelector("input[name='class']").value;
    const school = document.querySelector("input[name='school']").value;

    const data = {
      name: name,
      class: studentClass,
      school: school
    };

    fetch("https://script.google.com/macros/s/AKfycbwFdr7w_9rfxxHzJfoQFSWTTSy13IWw4AbJDO--MZbq3Ooal-ikpQdTmioFio3H04OVew/exec", {
      method: "POST",
      body: JSON.stringify(data),
      headers: {
        "Content-Type": "application/json"
      }
    })
    .then(response => response.json())
    .then(result => {
      if (result.result === "success") {
        alert("Đã gửi dữ liệu thành công (ID: " + result.id + ")");
      } else {
        alert("Lỗi: " + result.message);
      }
    })
    .catch(error => {
      alert("Lỗi gửi dữ liệu: " + error);
    });
  });
</script>
