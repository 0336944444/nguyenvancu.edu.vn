<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>

  <form action="https://script.google.com/macros/s/AKfycbyPw_zAJjpABwF1yWKJrea0l-vbsYPJcGMYRvlVr-NaRkDBy2UeZLBsCaLZLTNL_Ss5/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="document.getElementById('responseMessage').innerText='Đang gửi dữ liệu...';">
    
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="class" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <p id="responseMessage"></p>

  <iframe name="hidden_iframe" style="display:none;" onload="document.getElementById('responseMessage').innerText='Đã gửi dữ liệu thành công!'"></iframe>

  <hr>

  <button onclick="loadData()">Hiện danh sách</button>

  <table id="studentTable" style="display: none;">
    <thead>
      <tr>
        <th>STT</th>
        <th>ID</th>
        <th>Họ và tên</th>
        <th>Lớp</th>
        <th>Trường</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function loadData() {
      fetch("https://script.google.com/macros/s/AKfycbyPw_zAJjpABwF1yWKJrea0l-vbsYPJcGMYRvlVr-NaRkDBy2UeZLBsCaLZLTNL_Ss5/exec")
        .then(response => response.json())
        .then(data => {
          const table = document.getElementById("studentTable");
          const tbody = table.querySelector("tbody");
          tbody.innerHTML = ""; // clear old rows
          data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.stt}</td>
              <td>${row.id}</td>
              <td>${row.name}</td>
              <td>${row.class}</td>
              <td>${row.school}</td>
            `;
            tbody.appendChild(tr);
          });
          table.style.display = "table";
        })
        .catch(error => {
          alert("Không thể tải dữ liệu: " + error);
        });
    }
  </script>
</body>
</html>
