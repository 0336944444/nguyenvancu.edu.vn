<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>

  <form action="https://script.google.com/macros/s/AKfycbyPw_zAJjpABwF1yWKJrea0l-vbsYPJcGMYRvlVr-NaRkDBy2UeZLBsCaLZLTNL_Ss5/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="document.getElementById('responseMessage').innerText='Đang gửi dữ liệu...';">
    
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="class" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <iframe name="hidden_iframe" style="display:none;" onload="document.getElementById('responseMessage').innerText='Đã gửi dữ liệu thành công!'"></iframe>

  <p id="responseMessage"></p>

  <hr>

  <button onclick="showList()">Hiện danh sách</button>
  <div id="frameContainer" style="margin-top: 20px;"></div>

  <script>
    function showList() {
      document.getElementById("frameContainer").innerHTML =
        '<iframe src="list.html" width="100%" height="400px" style="border:1px solid #ccc;"></iframe>';
    }
  </script>
</body>
</html>
