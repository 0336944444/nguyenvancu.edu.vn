<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>

  <form id="dataForm">
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="class" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <p id="responseMessage"></p>

  <script>
    const form = document.getElementById("dataForm");
    const message = document.getElementById("responseMessage");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      message.innerText = "Đang gửi dữ liệu...";

      const formData = {
        name: form.name.value,
        class: form.class.value,
        school: form.school.value
      };

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbwFdr7w_9rfxxHzJfoQFSWTTSy13IWw4AbJDO--MZbq3Ooal-ikpQdTmioFio3H04OVew/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.result === "success") {
          message.innerText = "Đã gửi dữ liệu thành công! Mã ID: " + result.id;
          form.reset();
        } else {
          message.innerText = "Có lỗi: " + result.message;
        }
      } catch (error) {
        console.error(error);
        message.innerText = "Không thể gửi dữ liệu. Vui lòng thử lại.";
      }
    });
  </script>
</body>
</html>
