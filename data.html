<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 8px 0; padding: 8px; width: 100%; max-width: 300px; }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>
  <form id="dataForm">
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="class" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById('dataForm');
    const result = document.getElementById('result');

    function generateID(length = 6) {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = form.name.value.trim();
      const cls = form.class.value.trim();
      const school = form.school.value.trim();
      const id = generateID();

      const response = await fetch(
        'https://script.google.com/macros/s/AKfycbwFdr7w_9rfxxHzJfoQFSWTTSy13IWw4AbJDO--MZbq3Ooal-ikpQdTmioFio3H04OVew/exec',
        {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name, class: cls, school })
        }
      );

      result.textContent = 'Đã gửi dữ liệu thành công (ID: ' + id + ')';
      form.reset();
    });
  </script>
</body>
</html>
