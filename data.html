<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>
  <form id="dataForm">
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="classname" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <p id="responseMessage"></p>

  <script>
    document.getElementById("dataForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const form = e.target;
      const name = form.name.value.trim();
      const className = form.classname.value.trim(); // đã đổi tên tránh lỗi
      const school = form.school.value.trim();

      const data = {
        name: name,
        class: className,
        school: school
      };

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbwFdr7w_9rfxxHzJfoQFSWTTSy13IWw4AbJDO--MZbq3Ooal-ikpQdTmioFio3H04OVew/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (result.result === "success") {
          document.getElementById("responseMessage").textContent = `Đã gửi dữ liệu thành công (ID: ${result.id})`;
        } else {
          document.getElementById("responseMessage").textContent = `Lỗi: ${result.message}`;
        }

        form.reset();
      } catch (error) {
        document.getElementById("responseMessage").textContent = "Đã có lỗi xảy ra khi gửi.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
