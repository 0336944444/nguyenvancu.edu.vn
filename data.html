<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu học sinh</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Form nhập danh sách học sinh</h2>

  <form 
    action="https://script.google.com/macros/s/AKfycbwFdr7w_9rfxxHzJfoQFSWTTSy13IWw4AbJDO--MZbq3Ooal-ikpQdTmioFio3H04OVew/exec"
    method="POST"
    target="hidden_iframe"
    onsubmit="handleSubmit();"
  >
    <label>Họ và tên:</label><br>
    <input type="text" name="name" required><br>

    <label>Lớp:</label><br>
    <input type="text" name="class" required><br>

    <label>Trường:</label><br>
    <input type="text" name="school" required><br>

    <button type="submit">Gửi dữ liệu</button>
  </form>

  <iframe 
    name="hidden_iframe" 
    style="display:none;" 
    onload="handleIframeLoad();">
  </iframe>

  <p id="responseMessage"></p>

  <script>
    let formSubmitted = false;

    function handleSubmit() {
      document.getElementById('responseMessage').innerText = 'Đang gửi dữ liệu...';
      formSubmitted = true;
    }

    function handleIframeLoad() {
      if (formSubmitted) {
        document.getElementById('responseMessage').innerText = 'Đã gửi dữ liệu thành công!';
        formSubmitted = false;
      }
    }
  </script>
</body>
</html>
